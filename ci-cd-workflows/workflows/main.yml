name: SentinelX CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Build Frontend Docker Image
      run: docker build -t aruneshw/sentinelx-frontend:latest ./frontend
      
    - name: Build Backend Docker Image
      run: docker build -t aruneshw/sentinelx-backend:latest ./backend
      
