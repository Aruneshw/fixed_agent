apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelx-frontend
  labels:
    app: sentinelx-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinelx-frontend
  template:
    metadata:
      labels:
        app: sentinelx-frontend
    spec:
      containers:
      - name: frontend
        image: aruneshw/sentinelx-frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: LoadBalancer
  selector:
    app: sentinelx-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
